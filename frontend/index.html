<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>QueueFlow | Enterprise Queue Management & Token Dispatch Platform</title>
    <meta
      name="description"
      content="High-throughput queue management and live token dispatch platform. Organize waiting customers, manage multi-counter operations, and monitor service performance."
    />
    <meta name="keywords" content="queue management system, token generator, waiting list, customer service counter, dispatch operations" />
    <meta name="author" content="QueueFlow Operations Inc." />
    <link rel="canonical" href="https://queueflow.io" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://queueflow.io/" />
    <meta property="og:title" content="QueueFlow | Enterprise Queue Management Platform" />
    <meta property="og:description" content="Organize counter queues, generate atomic tokens, reorder waiting lines, and analyze service performance with real database metrics." />
    <meta property="og:image" content="https://queueflow.io/og-image.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://queueflow.io/" />
    <meta name="twitter:title" content="QueueFlow | Enterprise Queue Management Platform" />
    <meta name="twitter:description" content="High-throughput queue management and live token dispatch platform." />

    <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

    <!-- Structured Data (Schema.org) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "QueueFlow",
        "operatingSystem": "Web",
        "applicationCategory": "BusinessApplication",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "description": "Enterprise Queue Operations & Customer Waiting Line Management Platform"
      }
    </script>
    <!-- Theme Preload Script: Warm Editorial & Dark Espresso Foundation -->
    <script>
      (function() {
        var theme = localStorage.getItem('queueflow_theme') || 'light';
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.style.colorScheme = 'light';
        }
      })();
    </script>
  </head>
  <body class="bg-[#F8F6F0] dark:bg-[#1C1815] text-[#26221F] dark:text-[#FAF8F5] antialiased selection:bg-[#8C532B] selection:text-white min-h-screen">

    >

    <div id="root"></div>
